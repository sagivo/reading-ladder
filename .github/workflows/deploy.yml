name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Production deploy on every push to main (i.e. every merged PR).
      - name: Deploy to production
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c2456d993e0c5f12325e5abdf2bac1ac
          command: pages deploy dist --project-name=reading-ladder

      # Preview deploy for every PR, with its own preview URL.
      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c2456d993e0c5f12325e5abdf2bac1ac
          command: pages deploy dist --project-name=reading-ladder --branch=${{ github.head_ref }}
